services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  # Medusa Server
  # This service runs the Medusa backend application
  # and the admin dashboard.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      secrets:
        - backend_env
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"
      - "5173:5173"
    env_file:
      - apps/backend/.env
    networks:
      - medusa_network

  # Storefront
  # This service runs the Next.js Starter Storefront
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      secrets:
        - storefront_env
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"
    env_file:
      - apps/storefront/.env
    entrypoint: ["/usr/local/bin/start-storefront"]
    networks:
      - medusa_network

volumes:
  postgres_data:

secrets:
  storefront_env:
    file: apps/storefront/.env
  backend_env:
    file: apps/backend/.env

networks:
  medusa_network:
    driver: bridge
